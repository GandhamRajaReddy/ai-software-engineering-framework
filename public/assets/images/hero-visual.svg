<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <linearGradient id="heroAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272A" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#heroBg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="900" cy="200" r="300" fill="#6366F1" opacity="0.12" filter="blur(80px)" />

  <!-- Browser Frame Mockup -->
  <g transform="translate(150, 100)">
    <rect width="900" height="480" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
    <!-- Window controls -->
    <circle cx="30" cy="25" r="6" fill="#EF4444" />
    <circle cx="50" cy="25" r="6" fill="#F59E0B" />
    <circle cx="70" cy="25" r="6" fill="#10B981" />
    <rect x="120" y="16" width="300" height="18" rx="6" fill="#141418" />

    <!-- Mock UI Content -->
    <rect x="40" y="70" width="220" height="370" rx="10" fill="#141418" stroke="#27272A" stroke-width="1" />
    <rect x="280" y="70" width="580" height="140" rx="10" fill="#141418" stroke="#27272A" stroke-width="1" />
    <rect x="280" y="230" width="280" height="210" rx="10" fill="#141418" stroke="#27272A" stroke-width="1" />
    <rect x="580" y="230" width="280" height="210" rx="10" fill="#141418" stroke="#27272A" stroke-width="1" />

    <!-- Accent Highlights -->
    <rect x="310" y="100" width="180" height="12" rx="4" fill="url(#heroAccent)" />
    <rect x="310" y="125" width="340" height="8" rx="4" fill="#A1A1AA" opacity="0.4" />
  </g>

  <!-- Title Overlay -->
  <text x="180" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#EDEDED">ai-software-engineering-framework</text>
  <text x="180" y="645" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A1A1AA">Enterprise production verified application</text>
</svg>