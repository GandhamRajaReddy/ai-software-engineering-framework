<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
  </defs>

  <!-- Phone Chassis -->
  <rect x="25" y="25" width="350" height="750" rx="48" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="4" />
  <!-- Screen Area -->
  <rect x="40" y="45" width="320" height="710" rx="36" fill="url(#phoneGrad)" />
  <!-- Dynamic Island -->
  <rect x="150" y="55" width="100" height="26" rx="13" fill="#000000" />

  <!-- App Header -->
  <text x="65" y="130" font-family="sans-serif" font-size="22" font-weight="800" fill="#EDEDED">ai-software-engineering-framework</text>
  <circle cx="325" cy="122" r="14" fill="#6366F1" opacity="0.8" />

  <!-- App Cards -->
  <rect x="60" y="160" width="280" height="120" rx="16" fill="#0A0A0C" stroke="#27272A" stroke-width="1" />
  <rect x="60" y="300" width="280" height="160" rx="16" fill="#0A0A0C" stroke="#27272A" stroke-width="1" />
  <rect x="60" y="480" width="280" height="180" rx="16" fill="#0A0A0C" stroke="#27272A" stroke-width="1" />

  <!-- Bottom Navigation Bar -->
  <rect x="40" y="690" width="320" height="65" fill="#141418" opacity="0.95" />
  <circle cx="100" cy="720" r="10" fill="#6366F1" />
  <circle cx="200" cy="720" r="10" fill="#A1A1AA" opacity="0.5" />
  <circle cx="300" cy="720" r="10" fill="#A1A1AA" opacity="0.5" />
</svg>