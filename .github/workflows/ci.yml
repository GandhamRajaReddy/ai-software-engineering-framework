name: ASEF CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984b76d921601d7c # v4.3.4

  node-test:
    name: Hardened Subprocess & Verification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Reproducible Node Install (No Fallback)
        run: npm ci

      - name: Run Node Test Suite
        run: npm test

  backend-verification:
    name: Reference Backend Pytest & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Locked Python Dependencies
        working-directory: examples/backend-production-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Alembic Schema Upgrades & Downgrades (Admin Role)
        working-directory: examples/backend-production-service
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/testdb
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Configure Dedicated Non-Superuser Role for RLS
        working-directory: examples/backend-production-service
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/testdb
        run: |
          python tests/setup_app_user.py

      - name: Run Pytest Suite with Non-Superuser Tenant Boundary Assertions
        working-directory: examples/backend-production-service
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://app_user:app_password@localhost:5432/testdb
          ADMIN_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/testdb
          ENVIRONMENT: test
        run: |
          set -o pipefail
          python -m pytest tests/ -v -s --tb=short 2>&1 | tee pytest.log

  docker-build-smoke:
    name: Production Docker Multi-Stage Build & Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Hardened Container
        run: |
          docker build -t asef/backend-reference:test examples/backend-production-service/

      - name: Container Smoke Test (/readyz)
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL="sqlite+aiosqlite:////tmp/test.db" \
            -e JWT_SECRET="ci-development-secret-key-32-chars-minimum!" \
            asef/backend-reference:test
          sleep 6
          docker logs test-api
          curl -f http://localhost:8000/healthz || exit 1
          curl -f http://localhost:8000/readyz || exit 1
          docker stop test-api

  security-audit:
    name: SkillSpector & Release Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Reproducible Node Install
        run: npm ci

      - name: Run SkillSpector Static Scan
        run: node bin/asef.js scan-skill skills/

      - name: Run Production Release Gate Check (SwiftLink SaaS Application)
        run: node bin/asef.js gate-check examples/saas-url-shortener

  swiftlink-verification:
    name: SwiftLink SaaS Application Verification & Container Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Run SwiftLink Unit & Integration Test Suite
        working-directory: examples/saas-url-shortener
        run: npm test

      - name: Build Hardened Container
        run: |
          docker build -t asef/swiftlink:test examples/saas-url-shortener/

      - name: Container Smoke Test (Health, Readiness & Authenticated Token Flow)
        run: |
          docker run -d --name test-swiftlink -p 3000:3000 \
            -e NODE_ENV=development \
            -e JWT_SECRET="ci-development-secret-key-32-chars-minimum!" \
            -e SWIFTLINK_API_KEY="ci-tenant-api-key-secure-secret-token" \
            asef/swiftlink:test
          sleep 4
          docker logs test-swiftlink
          curl -f http://localhost:3000/api/healthz || exit 1
          curl -f http://localhost:3000/api/readyz || exit 1
          curl -f -X POST http://localhost:3000/api/auth/token \
            -H "Content-Type: application/json" \
            -d '{"tenantId":"ci-tenant","userId":"ci-user","apiKey":"ci-tenant-api-key-secure-secret-token"}' || exit 1
          docker stop test-swiftlink
